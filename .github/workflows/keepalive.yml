name: Keepalive Supabase
# Proyek Supabase gratis di-pause bila database tidak aktif ~1 minggu. Ping tiap 3 hari (Rp0).
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/keepalive.js
